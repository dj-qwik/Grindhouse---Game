# Render Blueprint — https://render.com/docs/blueprint-spec
# Grindhouse on Robinhood Chain MAINNET (4663): online game + real-money (ETH) matches.
#
# Secrets are generated by Render and never shown to anyone; each process derives its own wallet from them.
# On first boot the game server deploys its own escrow contract once its gas wallet is funded (see /status).
# You set two things in the dashboard: OWNER_ADDRESS (your wallet: receives the 10% house fee, guardian, and the
# escrow admin after a 2-day handover) and PRIVY_APP_ID (the public Privy App ID).
#
# LEAN LAUNCH: server-held derived keys and both result co-signers run inside this one service. That means whoever
# controls this Render account controls the results of matches in progress. Players' own wallets are never reachable.
# Hardening path (README "Going to mainnet, hardened"): Safe multisig admin, co-signers on independent infrastructure,
# KMS-held keys. After the first boot, pin ESCROW_ADDRESS + ESCROW_DEPLOY_BLOCK below so a database loss can't redeploy.
envVarGroups:
  - name: grindhouse-secrets
    envVars:
      - key: OPERATOR_SECRET       # the server's relayer wallet (pays gas for lobby/settlement txs)
        generateValue: true
      - key: COSIGNER_A_SECRET     # result co-signer A
        generateValue: true
      - key: COSIGNER_B_SECRET     # result co-signer B
        generateValue: true
      - key: COSIGNER_AUTH_TOKEN   # the server's credential when asking co-signers to sign
        generateValue: true

services:
  - type: web
    name: grindhouse-game
    runtime: node
    plan: standard               # 1 CPU / 2 GB: 60 Hz authoritative 8-player matches + two co-signer processes
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit    # every push to the deploy branch redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "4663"            # Robinhood Chain MAINNET (real ETH). Testnet is 46630.
      - key: ALLOW_RAW_KEYS_ON_MAINNET
        value: i-understand      # lean launch: server-held keys + embedded co-signers (see the note above)
      # - key: ESCROW_ADDRESS    # pin after the first boot (shown on /status), with its deploy block
      #   value: "0x…"
      # - key: ESCROW_DEPLOY_BLOCK
      #   value: "…"
      - key: PRIVY_APP_ID
        sync: false              # set this in the dashboard: your Privy App ID (public identifier)
      - key: OWNER_ADDRESS
        sync: false              # set this in the dashboard: your wallet address (0x…)
      - key: EMBEDDED_COSIGNERS
        value: "2"               # 2 co-signer processes beside the server (move to separate hosts to harden)
      - key: FILL_SECONDS
        value: "60"              # cash lobbies start at 8 skaters, or this long after the 2nd deposit
      - key: DATABASE_URL
        fromDatabase:
          name: grindhouse-db
          property: connectionString
      - fromGroup: grindhouse-secrets

databases:
  - name: grindhouse-db
    plan: basic-256mb            # paid: real-money evidence and escrow records must not expire (free Postgres does after 30 days)
    region: oregon
