<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cement:#B7B0A0;--ink:#22292B;--ink2:#2E3739;--rust:#B85435;--cream:#E8DDBD;
  --lime:#B4E64A;--cyan:#36DCE8;--coral:#FF5C69;--orange:#FF9B36;--violet:#9D75EA;
  --text:#F4EEDC;--dim:#A9A291;--panel:rgba(26,31,33,.94);--line:rgba(232,221,189,.16);
  --display:'Bowlby One',Impact,'Arial Black',sans-serif;--body:Rubik,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
a{color:var(--cyan)}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em}
/* ── top bar */
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:30;pointer-events:none}
#top>*{pointer-events:auto}
.wordmark{font:28px/1 var(--display);letter-spacing:.5px;color:var(--cream);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink);transform:rotate(-2deg)}
.wordmark b{color:var(--lime)}
#modeBadge{font:700 11px/1 var(--body);text-transform:uppercase;letter-spacing:1.5px;background:var(--coral);color:var(--ink);padding:4px 7px;border-radius:3px;transform:rotate(-2deg)}
.spacer{flex:1}
.wallet{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);box-shadow:3px 3px 0 #0006;border-radius:8px;padding:5px 6px 5px 12px}
.wallet .amt{display:grid;line-height:1.1}.wallet .amt small{font-size:11px;color:var(--dim)}.wallet .amt b{font-size:14px}
.iconbtn{background:var(--panel);border:2px solid var(--ink);border-radius:8px;width:38px;height:38px;cursor:pointer;box-shadow:3px 3px 0 #0006;font-size:17px}
body.playing #top{opacity:0;pointer-events:none}
body.playing #top>*{pointer-events:none}
/* ── buttons + form bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--cream);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;font-size:14px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.primary{background:var(--lime)}.btn.hot{background:var(--coral)}.btn.cyan{background:var(--cyan)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--cream)}
.btn.big{padding:14px 22px;font-size:17px}.btn.small{padding:6px 10px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.field{background:#151a1b;border:2px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font:inherit;width:100%;user-select:text}
.field:focus{outline:none;border-color:var(--lime)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:64px;display:grid;padding:8px 6px;border-radius:8px;border:2px solid var(--line);background:#151a1b;cursor:pointer;font-weight:800}
.seg button small{font-weight:400;color:var(--dim);font-size:11px}
.seg button.sel{border-color:var(--lime);background:#29321a}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.fine{font-size:12px;color:var(--dim);padding-left:16px;margin:4px 0 0}
.fine li{margin:3px 0}
.notice{display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:#3a2a16;border:2px solid var(--orange)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--lime)}
.receipt{display:grid;gap:6px;padding:12px 14px;border-radius:8px;background:#151a1b;border:2px dashed var(--line)}
.receipt .r{display:flex;justify-content:space-between;gap:10px}.receipt .r.win b{color:var(--lime)}
.addr{display:flex;gap:8px;align-items:center;background:#151a1b;border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.addr code{flex:1;word-break:break-all;user-select:text}
.steps{display:grid;gap:6px}.step{padding:10px 12px;border-radius:8px;background:#151a1b;border-left:4px solid var(--cyan)}
/* ── overlay cards */
#ov{position:fixed;inset:0;display:grid;place-items:center;z-index:20;padding:70px 14px 20px;overflow:auto;background:radial-gradient(ellipse at center,rgba(34,41,43,.35),rgba(20,24,25,.82))}
#ov[hidden]{display:none}
.card{width:min(860px,100%);background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 #000a;padding:22px;display:grid;gap:16px;animation:pop .22s cubic-bezier(.2,1.4,.4,1);position:relative}
.card h2{margin:0;font:30px/1.05 var(--display);color:var(--cream);letter-spacing:.3px}
.card h3{margin:0;font:18px/1.1 var(--display);color:var(--cream)}
.card p{margin:0}
@keyframes pop{from{transform:scale(.94) rotate(-.6deg);opacity:0}to{transform:none;opacity:1}}
.home{width:min(980px,100%);gap:20px}
.hero{display:grid;gap:6px}
.hero .title{font:clamp(54px,11vw,112px)/.86 var(--display);color:var(--cream);text-shadow:5px 5px 0 var(--ink),9px 9px 0 var(--coral);transform:rotate(-3deg);transform-origin:left;margin:6px 0 10px}
.hero .tagline{font:18px/1 var(--display);color:var(--lime);letter-spacing:2px;text-shadow:2px 2px 0 var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:8px;align-content:start;text-align:left;padding:16px;border-radius:12px;border:3px solid var(--ink);background:#1b2123;cursor:pointer;box-shadow:5px 5px 0 #000a;transition:transform .1s}
.mode:hover{transform:translate(-2px,-2px) rotate(-.4deg)}
.mode .k{font:22px/1 var(--display)}.mode .d{color:var(--dim);font-size:13px}
.mode.cash{background:linear-gradient(160deg,#2b3a17,#1b2123 60%)}.mode.cash .k{color:var(--lime)}
.mode.online .k{color:var(--cyan)}.mode.practice .k{color:var(--orange)}
.mode:disabled{opacity:.55;cursor:default;transform:none}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:#151a1b;border:1px solid var(--line)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.seats{grid-template-columns:repeat(2,1fr)}}
.seat{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:10px;border:2px dashed var(--line);min-height:110px;align-content:center}
.seat.on{border-style:solid;border-color:var(--ink);background:#1b2123}
.seat.you{border-color:var(--lime)}
.seat canvas,.seat img{width:64px;height:64px;border-radius:50%;background:#151a1b}
.seat .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .ghost{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--dim);font:22px var(--display)}
.arenas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){.arenas{grid-template-columns:repeat(2,1fr)}}
.arena-pick{display:grid;gap:2px;text-align:left;padding:10px;border-radius:10px;border:2px solid var(--line);background:#151a1b;cursor:pointer}
.arena-pick b{font:14px/1.1 var(--display)}.arena-pick small{color:var(--dim);font-size:11px}
.arena-pick.sel{border-color:var(--lime);background:#29321a}
.skaters{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:700px){.skaters{grid-template-columns:repeat(4,1fr)}}
.sk{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:2px solid var(--line);background:#151a1b;cursor:pointer;font-size:12px;font-weight:800}
.sk canvas{width:56px;height:56px}
.sk.sel{border-color:var(--lime);background:#29321a}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 12px;font-size:13px}
.keys kbd{font:700 11px/1 var(--body);background:var(--cream);color:var(--ink);border-radius:4px;padding:4px 6px;box-shadow:0 2px 0 #0008;white-space:nowrap;justify-self:start}
.remap{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;font-size:13px}
.remap button{min-width:90px}
.remap .waiting{background:var(--orange)}
.standings{display:grid;gap:6px}
.standings .pl{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:#151a1b}
.standings .pl.first{background:#29321a;border:2px solid var(--lime)}
.standings .pl.me{outline:2px solid var(--cyan)}
.standings .n{font:20px/1 var(--display);color:var(--dim)}.standings .first .n{color:var(--lime)}
.winner{display:grid;justify-items:center;gap:6px;text-align:center}
.winner .crown{font:clamp(40px,8vw,74px)/.9 var(--display);color:var(--lime);text-shadow:4px 4px 0 var(--ink),7px 7px 0 var(--coral);transform:rotate(-2deg)}
/* ── HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--body)}
#hud[hidden]{display:none}
.hclock{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:0}
.hclock .t{font:64px/1 var(--display);color:var(--cream);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink);letter-spacing:1px}
.hclock .t.hot{color:var(--coral);animation:throb .5s infinite alternate}
.hclock .sub{font:700 12px/1 var(--body);letter-spacing:2px;text-transform:uppercase;background:var(--ink);color:var(--lime);padding:4px 10px;border-radius:4px;margin-top:2px}
@keyframes throb{to{transform:scale(1.08)}}
.hsurv{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font:20px/1 var(--display)}
.hsurv small{font:600 11px/1 var(--body);color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.hfeed{position:absolute;top:62px;right:18px;display:grid;gap:4px;justify-items:end;width:360px}
.hfeed .k{display:flex;gap:6px;align-items:center;background:rgba(26,31,33,.86);border-left:4px solid var(--coral);padding:4px 10px;border-radius:4px;font-size:13px;font-weight:600;animation:slidein .25s}
.hfeed .k b{color:var(--cream)}.hfeed .k .w{color:var(--dim);font-size:11px;text-transform:uppercase}
.hfeed .k.me{border-left-color:var(--lime)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
#minimap{position:absolute;top:14px;left:14px;width:170px;height:170px;border-radius:50%;border:3px solid var(--ink);background:rgba(26,31,33,.75);box-shadow:3px 3px 0 #0008}
.hbottom{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:16px}
.hhealth{display:grid;gap:4px;width:min(340px,40vw)}
.hhealth .nm{font:16px/1 var(--display);color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.bar{height:22px;border-radius:5px;border:3px solid var(--ink);background:#151a1b;overflow:hidden;position:relative;box-shadow:3px 3px 0 #0008}
.bar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(180deg,#d3ff7a,var(--lime));transition:transform .12s}
.bar i.lag{background:var(--coral);transition:transform .6s .25s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--body);color:var(--cream);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.bar.low i:not(.lag){background:linear-gradient(180deg,#ff8b94,var(--coral))}
.hweap{margin-left:auto;display:grid;gap:6px;justify-items:end}
.slots{display:flex;gap:6px}
.slot{display:grid;justify-items:center;gap:2px;min-width:86px;padding:6px 10px;border-radius:8px;background:var(--panel);border:2px solid var(--ink);opacity:.6}
.slot.on{opacity:1;border-color:var(--lime);box-shadow:3px 3px 0 #0008}
.slot b{font:13px/1.1 var(--display)}.slot small{font-size:11px;color:var(--dim)}
.slot .ammo{font:22px/1 var(--display);color:var(--cream)}
.adr{height:14px;border-radius:4px;border:3px solid var(--ink);background:#151a1b;overflow:hidden;position:relative;box-shadow:3px 3px 0 #0008}
.adr i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cream),var(--lime));transition:transform .2s}
.adr.half i{background:linear-gradient(90deg,var(--lime),#d3ff7a)}.adr.full i{background:linear-gradient(90deg,var(--orange),var(--coral));animation:throb .4s infinite alternate}
.adr .m50{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink)}
.adr span{position:absolute;inset:0;display:grid;place-items:center;font:800 9px/1 var(--body);letter-spacing:1.5px;color:var(--cream);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
.hint{font-size:12px;color:var(--dim);background:rgba(26,31,33,.8);padding:3px 8px;border-radius:4px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross svg{position:absolute;left:-60px;top:-60px;width:120px;height:120px;overflow:visible}
.hitmark{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0}
.hitmark.on{animation:hm .25s}
@keyframes hm{0%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(.9)}}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:clamp(40px,8vw,92px)/1 var(--display);color:var(--cream);text-shadow:5px 5px 0 var(--ink),9px 9px 0 var(--coral);transform:rotate(-3deg);opacity:0}
.banner.on{animation:bann 1.6s cubic-bezier(.2,1.2,.4,1)}
@keyframes bann{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}15%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:scale(.95) rotate(-3deg)}}
.trickpop{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);text-align:center;font:24px/1 var(--display);color:var(--lime);text-shadow:3px 3px 0 var(--ink);opacity:0;white-space:nowrap}
.trickpop small{display:block;font:700 13px/1.4 var(--body);color:var(--cream);text-transform:uppercase;letter-spacing:1px}
.trickpop.on{animation:tp 1.3s}
@keyframes tp{0%{opacity:0;transform:translate(-50%,20px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,60,.55));opacity:0;transition:opacity .2s}
.zonewarn{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px rgba(255,92,105,.45);opacity:0;transition:opacity .3s}
.zonetext{position:absolute;top:110px;left:50%;transform:translateX(-50%);font:16px/1 var(--display);color:var(--coral);text-shadow:2px 2px 0 var(--ink);opacity:0}
.dmgdir{position:absolute;left:50%;top:50%;width:0;height:0}
.dmgdir i{position:absolute;left:-70px;top:-170px;width:140px;height:60px;background:radial-gradient(ellipse at 50% 100%,rgba(255,92,60,.85),transparent 70%);transform-origin:70px 170px;opacity:0;transition:opacity .6s}
.death{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;text-align:center}
.death .big{font:52px/1 var(--display);color:var(--coral);text-shadow:4px 4px 0 var(--ink)}
.death .by{font:700 15px/1.3 var(--body);background:var(--panel);padding:6px 12px;border-radius:6px}
.spec{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:auto;background:var(--panel);padding:6px 10px;border-radius:8px;border:2px solid var(--ink);font-weight:700;font-size:13px}
.netstat{position:absolute;right:18px;bottom:10px;font:600 11px/1 var(--body);color:var(--dim)}
.pip{position:absolute;right:22px;bottom:150px;width:300px;height:180px;border:4px solid var(--cream);box-shadow:6px 6px 0 var(--coral),0 0 0 3px var(--ink);transform:rotate(2deg);opacity:0;pointer-events:none}
.pip.on{opacity:1}
.pip span{position:absolute;left:-8px;top:-16px;background:var(--coral);color:var(--ink);font:16px/1 var(--display);padding:4px 8px;transform:rotate(-4deg)}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font:180px/1 var(--display);color:var(--cream);text-shadow:8px 8px 0 var(--ink),14px 14px 0 var(--coral)}
.prestart{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;text-align:center}
.prestart .a{font:28px/1 var(--display);color:var(--cream);text-shadow:3px 3px 0 var(--ink)}
.prestart .b{font-weight:600;color:var(--cream);background:var(--panel);padding:6px 12px;border-radius:6px}
.lockhint{position:absolute;left:50%;top:60%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--lime);padding:10px 16px;border-radius:8px;font-weight:800;pointer-events:auto;cursor:pointer}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--ink);font:28px var(--display);color:var(--cream)}
body[data-err]:after{content:attr(data-err);position:fixed;left:10px;bottom:10px;background:var(--coral);color:var(--ink);padding:8px 12px;border-radius:6px;z-index:99;font-weight:800}
#touch{display:none}
body.freeride #hBar,body.freeride .hweap{display:none}
</style>
</head>
<body>
<div id="loading">GRIND<span style="color:var(--lime)">HOUSE</span></div>
<div id="stage"></div>
<div id="top">
  <div class="wordmark">GRIND<b>HOUSE</b></div><span id="modeBadge">Beta</span>
  <div class="spacer"></div>
  <div class="wallet"><div class="amt"><small>Practice</small><b>Free play</b></div><button class="btn small" id="faucet" data-act="menu">Wallet</button></div>
  <button class="iconbtn" id="settingsBtn" title="Settings">⚙</button>
  <button class="iconbtn" id="mute" title="Sound">🔊</button>
</div>
<div id="hud" hidden>
  <canvas id="minimap" width="340" height="340"></canvas>
  <div class="hclock"><div class="t" id="hTime">60</div><div class="sub" id="hPhase">GO</div></div>
  <div class="hsurv"><span id="hAlive">8</span><small id="hAliveL">alive</small></div>
  <div class="hfeed" id="hFeed"></div>
  <svg class="hitmark" id="hitmark" viewBox="-13 -13 26 26"><g stroke="#FF5C69" stroke-width="3" stroke-linecap="round"><line x1="-11" y1="-11" x2="-5" y2="-5"/><line x1="11" y1="-11" x2="5" y2="-5"/><line x1="-11" y1="11" x2="-5" y2="5"/><line x1="11" y1="11" x2="5" y2="5"/></g></svg>
  <div class="dmgdir" id="dmgdir"></div>
  <div class="vignette" id="vig"></div>
  <div class="zonewarn" id="zw"></div><div class="zonetext" id="zt">OUTSIDE THE ZONE — GET IN</div>
  <div class="banner" id="banner"></div>
  <div class="trickpop" id="trick"></div>
  <div class="pip" id="pip"><span id="pipTxt">WRECKED</span></div>
  <div class="hbottom">
    <div class="hhealth"><div class="nm" id="hName">You</div><div class="bar" id="hBar"><i class="lag" id="hLag"></i><i id="hHp"></i><span id="hHpT">100</span></div><div class="adr" id="hAdrBar"><i id="hAdr"></i><b class="m50"></b><span id="hAdrT">ADRENALINE</span></div><div class="hint" id="hHint"></div></div>
    <div class="hweap"><div class="slots" id="hSlots"></div></div>
  </div>
  <div class="netstat" id="netstat"></div>
  <div id="hudExtra"></div>
</div>
<div id="ov" hidden></div>
